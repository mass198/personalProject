<template>
  <div class="modal-header slds-modal__header slds-size_1-of-1">
    <h4 class="title slds-text-heading_medium">
      Copy Quote Products to Opportunity
    </h4>
  </div>
  <!--End Modal Header-->
  <!--Modal Body-->
  <div
    class="slds-modal__content slds-var-p-around_x-small slds-size_1-of-1 slds-is-relative"
  >
    <!-- markup -->

    <template if:true={loaded}>
      <lightning-card>
        <div class="slds-text-color_error slds-text-align_center">
          Select which SKUs to copy from the Quote to the Opportunity
        </div>
        <div class="slds-text-color_error slds-text-align_center">
          NOTE: If the selected SKU exists on the Opportunity, the Quote Sales
          Price and Quantity will replace the Opportunity Sales Price and
          Quantity.<br />
        </div>
        <div class="slds-grid slds-wrap">
          <div class="slds-size_1-of-2">
            <div class="slds-box slds-var-m-around_x-small">
              <div class="slds-section slds-is-open">
                <h3
                  class="slds-section__title slds-theme_shade slds-text-align_center"
                >
                  <span
                    class="slds-truncate slds-var-p-horizontal_small slds-text-color_default"
                    title="Section Title"
                    style="font-size: 15px"
                    ><b>quoteHeader</b></span
                  >
                </h3>
                <h4
                  class="slds-section__title slds-theme_shade slds-text-align_center"
                >
                  <span
                    class="slds-truncate slds-var-p-horizontal_small slds-text-color_default"
                    title="Section Title"
                    style="font-size: 12px"
                    ><b>PriceList: quotePricelist</b></span
                  >
                </h4>
                <h4
                  class="slds-section__title slds-theme_shade slds-text-align_center"
                >
                  <span
                    class="slds-truncate slds-var-p-horizontal_small slds-text-color_default"
                    title="Section Title"
                    style="font-size: 15px; color: red"
                    ><b>Max Lines Selected Allowed: 50</b></span
                  >
                </h4>
                <h4
                  class="slds-section__title slds-theme_shade slds-text-align_center"
                >
                  <span
                    class="slds-truncate slds-var-p-horizontal_small slds-text-color_default"
                    title="Section Title"
                    style="font-size: 15px; color: red"
                    ><b>Lines Selected : selectedlength</b></span
                  >
                </h4>
              </div>
            </div>
          </div>
          <div class="slds-size_1-of-2">
            <div class="slds-box slds-var-m-around_x-small">
              <div class="slds-section slds-is-open">
                <h3
                  class="slds-section__title slds-theme_shade slds-text-align_center"
                >
                  <span
                    class="slds-truncate slds-var-p-horizontal_small slds-text-color_default"
                    title="Section Title"
                    style="font-size: 15px"
                    ><b>oppHeader</b></span
                  >
                </h3>
                <h4
                  class="slds-section__title slds-theme_shade slds-text-align_center"
                >
                  <span
                    class="slds-truncate slds-var-p-horizontal_small slds-text-color_default"
                    title="Section Title"
                    style="font-size: 12px"
                    ><b>PriceList: oppPricelist</b></span
                  >
                </h4>
              </div>
            </div>
          </div>
        </div>
      </lightning-card>
    </template>
    <lightning-button onclick={handleAlertClick} label="Open Alert Modal">
    </lightning-button>
    <lightning-button onclick={handleSave} label="Cust Code">
    </lightning-button>
  </div>
  <!--End of Modal Body-->
  <!--Modal Footer-->

  <!--End of Modal Footer-->
</template>
