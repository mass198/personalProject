<template>
    <lightning-card title = "My first Calculator" >
        <lightning-input type="number" label = "first number" onchange={firstInputHandler} value={firstnumber}></lightning-input>
        <lightning-input type="number" label = "second number" onchange={secondInputHandler}></lightning-input>
        <h2>{result}</h2>
<div class="changeit" >
        <lightning-button label="add" onclick={addhandler} ></lightning-button>
        <lightning-button label="sub" onclick={subhandler} ></lightning-button>
        <lightning-button label="divide" onclick={divhandler} ></lightning-button>
        <lightning-button label="mul" onclick={mulhandler} ></lightning-button>
</div>
    </lightning-card>
</template>
